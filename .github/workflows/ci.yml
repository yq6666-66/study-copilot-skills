name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install locked dependencies (hash-checked)
        run: |
          python -m pip install --quiet --only-binary=:all: --require-hashes -r requirements-ci.lock

      - name: Unit tests (offline; real-model integration tests auto-skip without local model)
        run: python -m pytest tests/ -q

      - name: Validate data records & subject profiles (Schema 1.1)
        run: python scripts/validate_records.py

      - name: Doc path references must exist (anti path-drift gate for AI-authored docs)
        run: python scripts/check_doc_paths.py

      - name: Contract coverage gate (no dead links, no orphan contracts)
        run: python scripts/check_contract_coverage.py

      - name: Number consistency gate (docs vs logs/qwen traces)
        run: python scripts/check_numbers.py

      - name: Semgrep security gate (secrets / user paths / shell exec)
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --quiet --only-binary=:all: --require-hashes -r requirements-semgrep.lock
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --config .semgrep.yml --error --metrics=off --disable-version-check .

