name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: python -m pip install --quiet numpy requests jsonschema pytest

      - name: Unit tests (offline; real-model integration tests auto-skip without local model)
        run: python -m pytest tests/ -q

      - name: Validate data records & subject profiles (Schema 1.1)
        run: python scripts/validate_records.py

      - name: Doc path references must exist (anti path-drift gate for AI-authored docs)
        run: python scripts/check_doc_paths.py

      - name: Contract coverage gate (no dead links, no orphan contracts)
        run: python scripts/check_contract_coverage.py

      - name: Semgrep security gate (secrets / user paths / shell exec)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --quiet semgrep
          semgrep --config .semgrep.yml --error --metrics=off .

