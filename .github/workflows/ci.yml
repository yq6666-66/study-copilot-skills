name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet numpy requests jsonschema pytest

      - name: Unit tests (offline; real-model integration tests auto-skip without local model)
        run: python -m pytest tests/ -q

      - name: Validate data records & subject profiles (Schema 1.1)
        run: python scripts/validate_records.py

      - name: Semgrep security gate (secrets / user paths / shell exec)
        run: |
          python -m pip install --quiet semgrep
          semgrep --config .semgrep.yml --error --metrics=off .

